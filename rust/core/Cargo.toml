[package]
name = "uvoc-core"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
description = "From-scratch Rust port of TutteInstitute/evoc clustering (EVoC), wasm32-friendly core"

[dependencies]
# Intentionally empty: the core must stay dependency-free for lean wasm builds.

[dev-dependencies]
serde_json = "1"

[lints.clippy]
# Index-based loops and wide tuple/array shapes here mirror the Python/numba
# reference structure on purpose (see PORTING.md); rewriting them to
# iterator chains risks silently changing bit-for-bit parity behavior.
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
manual_repeat_n = "allow"
if_same_then_else = "allow"
needless_return = "allow"
